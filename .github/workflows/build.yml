name: Build APK

# main par har push (code change) par APK khud ban jata hai.
# version.json + updates/ wale commit par dobara trigger nahi hota.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'updates/**'
      - 'version.json'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Version bump
        id: ver
        run: |
          python3 - <<'EOF'
          import json, os
          code, name = 16, "3.0.2"
          try:
              d = json.load(open('version.json'))
              code = int(d.get('versionCode', code))
              name = str(d.get('versionName', name))
          except Exception:
              pass
          ncode = code + 1
          parts = name.split('.')
          try:
              parts[-1] = str(int(parts[-1]) + 1)
              nname = '.'.join(parts)
          except Exception:
              nname = name
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"code={ncode}\nname={nname}\n")
          print(f"next: {ncode} / {nname}")
          EOF

      - name: Build APK
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          UPDATE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/version.json
        run: bash build-apk.sh

      - name: Publish update
        env:
          VCODE: ${{ steps.ver.outputs.code }}
          VNAME: ${{ steps.ver.outputs.name }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p updates
          cp apk/lapakfree-debug.apk updates/lapakfree.apk
          python3 - <<'EOF'
          import json, os
          repo = os.environ['GITHUB_REPOSITORY']
          notes = (os.environ.get('NOTES') or 'naya build').split('\n')[0][:200]
          d = {
              "versionCode": int(os.environ['VCODE']),
              "versionName": os.environ['VNAME'],
              "apkUrl": f"https://raw.githubusercontent.com/{repo}/main/updates/lapakfree.apk",
              "notes": notes,
          }
          json.dump(d, open('version.json', 'w'), indent=2, ensure_ascii=False)
          print(json.dumps(d, indent=2, ensure_ascii=False))
          EOF
          git config user.name "lapakfree-bot"
          git config user.email "lapakfree-bot@users.noreply.github.com"
          git add -f updates/lapakfree.apk version.json
          git commit -m "auto: build v${VNAME} (${VCODE}) [skip ci]" || echo "no changes"
          git push
